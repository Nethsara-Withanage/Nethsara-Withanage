<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nethsara Withanage — Systems Programming, Quantitative Modeling, Algorithms">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="55%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#fade)"/>

  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="299.5" x2="1200" y2="299.5" stroke="#21262d" stroke-width="1"/>

  <rect x="2" y="40" width="2" height="220" fill="url(#edge)"/>

  <g>
    <circle cx="90" cy="150" r="2" fill="#58a6ff"/>
    <text x="110" y="155" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="13" letter-spacing="3" fill="#8b949e">SYSTEMS / QUANT / CS@UCSC</text>
  </g>

  <text x="90" y="118" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f6fc">Nethsara Withanage</text>

  <text x="90" y="195" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="18" fill="#8b949e">Systems Programming <tspan fill="#30363d">•</tspan> Quantitative Modeling <tspan fill="#30363d">•</tspan> Algorithms</text>

  <g fill="none" stroke="#30363d" stroke-width="1.2">
    <rect x="1050" y="55" width="100" height="100" rx="4"/>
    <line x1="1050" y1="88" x2="1150" y2="88"/>
    <line x1="1083" y1="55" x2="1083" y2="155"/>
    <line x1="1116" y1="55" x2="1116" y2="155"/>
  </g>
  <circle cx="1066.5" cy="71.5" r="3" fill="#58a6ff"/>

</svg>
